<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Click and Rich</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/main.js" type="module" defer></script>
  </head>
  <body>
    <header class="header">
      <div class="container header__container">
        <h1 class="header__logo">Click and Rich</h1>
        <nav class="header__nav">
          <ul class="header__list">
            <li>
              <p class="header__elem">
                За клик <br /><span id="tapCounter"></span>
              </p>
            </li>
            <li>
              <p class="header__elem">
                Монет/сек <br /><span id="persecCounter"></span>
              </p>
            </li>
          </ul>
        </nav>
        <a href="https://github.com/snkio">GitHub</a>
      </div>
    </header>
    <main>
      <section class="gameplay" id="play">
        <div class="container gameplay__container">
          <div class="gameplay__content">
            <p class="gameplay__text">
              <span id="moneyCounter"></span>
            </p>
            <div class="gameplay__shadow">
              <button class="gameplay__coin" id="coin"></button>
            </div>
          </div>
          <aside class="main-shop">
            <h2>Магазин</h2>
            <ul class="main-shop__list" id="shop"></ul>
          </aside>
        </div>
      </section>
    </main>
  </body>
</html>
