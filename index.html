<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Click and Rich</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <main>
      <section class="main-menu">
        <div class="container">
          <h1>Click and Rich</h1>
          <ul class="main-menu__list" id="menu"></ul>
        </div>
      </section>
      <section class="gameplay hidden" id="play">
        <div class="container gameplay__container">
          <div class="gameplay__content">
            <div class="gameplay__list">
              <p class="gameplay__elem">
                Прибыль за клик <span id="tapCounter"></span>
              </p>
              <p class="gameplay__elem">
                Автокликер <span id="persecCounter"></span>
              </p>
            </div>
            <p class="gameplay__text">
              <span id="moneyCounter">0</span>
            </p>
            <button class="gameplay__coin" id="coin"></button>
          </div>
          <div class="main-shop">
            <ul class="main-shop__list" id="shop"></ul>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
